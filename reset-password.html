<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valgharie — Nouveau mot de passe</title><link rel="stylesheet" href="style.css"></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:20px">
<section class="modal-box auth-box" style="position:relative"><h2>Nouveau mot de passe</h2><p>Choisis un nouveau mot de passe.</p>
<form id="f"><label>Nouveau mot de passe<input id="p" type="password" minlength="8" required></label>
<label>Confirmer<input id="p2" type="password" minlength="8" required></label>
<button class="btn primary auth-submit">Enregistrer</button><div class="auth-message" id="m"></div></form>
</section></main><script>
document.querySelector("#f").addEventListener("submit",async e=>{
 e.preventDefault(); const p=document.querySelector("#p").value,p2=document.querySelector("#p2").value,m=document.querySelector("#m");
 if(p!==p2){m.textContent="Les mots de passe ne correspondent pas.";return}
 const token=new URLSearchParams(location.search).get("token");
 const r=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:p})});
 const d=await r.json(); m.textContent=d.ok?"Mot de passe changé. Tu peux retourner au site.":d.error||"Erreur.";
 if(d.ok)m.classList.add("success");
});
</script></body></html>
